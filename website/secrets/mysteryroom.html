<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../script.js"></script>
    <title>Roots</title>
    <style>
        body{
            margin: 0;
            box-sizing: border-box;
            background-color: #000000;
            min-height: 100vh;
        }
        main{
            min-height: 100vh;
            width: 100%;
            align-items: center;
            justify-content: center;
            display: flex;
        }
        p{
            color: white;
            position: absolute;
            bottom: 150px;
            font-size: 36px;
        }
    </style>
</head>
<body onclick="clicked()">
    <main>
        <img src="https://deltarune.wiki/images/Man_overworld_tree.gif" alt="A tree, there is a woman behind it.">
        <p>Click to begin interaction.</p>
    </main>
</body>
<script>
const defaultTypingSpeed = 300;
const defaultDeletingSpeed = 100;
let music = new Audio("https://deltarune.wiki/images/Man_music.ogg");
let started = false;
let userClicked = false;
let currentMessageEnded = false;
music.loop = true;

async function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms))
}

async function smoothTalking(text) {
    let paragraph = document.querySelector("p")
    typingSpeed = defaultTypingSpeed;
    deletingSpeed = defaultDeletingSpeed;

    for (let char in paragraph.innerHTML) {
        paragraph.innerHTML = paragraph.innerHTML.slice(0, paragraph.innerHTML.length-1)
        if (char == 0) {
            await wait(deletingSpeed*5)
        } else {
            await wait(deletingSpeed)
        }
    }

    for (let char in text) {
        paragraph.innerHTML += text[char]
        await wait(typingSpeed)
    }
    currentMessageEnded = true;
}

async function quitYapping() {
    dialogue = [
        "There seems to be a woman here.", 
        "She seems happy you found the secret.",
        "Feel free to alert everyone of your finding.",
        "You obtained: The Egg",
        "Enjoy the rest of the website."
    ]
    for (text of dialogue) {
        await smoothTalking(text);

        while (true) { // this'll just wait for the user to click
            await wait(100);
            if (userClicked) {
                break
            }
        }

        userClicked = false, currentMessageEnded = false;
    }
    await wait(3000);
    pageAssignment("index");
}

function clicked() {
    music.play()
    if (started) {
        if (currentMessageEnded) {
            userClicked = true;
        } else {
            typingSpeed = 10;
            deletingSpeed = 4;
        }
        return
    } 
    quitYapping();
    started = true
}
</script>
</html>
